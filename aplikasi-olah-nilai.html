    <!-- FIREBASE & CORE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG (SD Negeri Pasirmae 1)
        const firebaseConfig = {
            apiKey: "AIzaSyBL7-vUv3Kqcpxjaq_6AWGgFFirc7p-jhs",
            authDomain: "sd-negeri-pasirmae-1.firebaseapp.com",
            projectId: "sd-negeri-pasirmae-1",
            storageBucket: "sd-negeri-pasirmae-1.firebasestorage.app",
            messagingSenderId: "19037387384",
            appId: "1:19037387384:web:f396f39545f54ac7818b8d"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Kunci Root Path sesuai dengan database Anda
        const appId = 'sd-negeri-pasirmae-1';

        // STATE MANAGEMENT
        const state = {
            user: null,
            activeClassId: null,
            activeClassName: '',
            classes: [],
            students: [],
            settings: {
                judul: "LAPORAN HASIL ASESMEN SUMATIF",
                tipe_asesmen: "Asesmen Sumatif Akhir Semester",
                instansi: "SD NEGERI PASIRMAE 1",
                alamat: "Jl. Raya Pasirmae No. 123, Kec. Cipeundeuy, Kab. Pandeglang",
                kelas: "",
                tahun_ajaran: "2025/2026",
                semester: "1 (GANJIL)",
                display_mode: 'decimal',
                subjects: [
                    { id: 'pai', label: 'PAIBP' }, 
                    { id: 'pancasila', label: 'Pancasila' }, 
                    { id: 'ipas', label: 'IPAS' }, 
                    { id: 'mtk', label: 'Matematika' }, 
                    { id: 'bind', label: 'B. Indonesia' }, 
                    { id: 'bing', label: 'B. Inggris' }, 
                    { id: 'bsun', label: 'B. Sunda' }, 
                    { id: 'pjok', label: 'PJOK' }, 
                    { id: 'seni', label: 'Seni Budaya' }
                ],
                skor_ideal: {},
                kktp: {},
                kepsek: "MASUKKAN NAMA KEPSEK, S.Pd.",
                nip_kepsek: "198001012000011001",
                wali_kelas: "",
                nip_wali: ""
            },
            currentView: 'dashboard',
            activeSubjectId: 'pai',
            search: '',
            isCollapsed: false,
            unsubs: []
        };

        const syncSubParams = () => {
            state.settings.subjects.forEach(s => {
                if (!state.settings.skor_ideal[s.id]) state.settings.skor_ideal[s.id] = 100;
                if (!state.settings.kktp[s.id]) state.settings.kktp[s.id] = 75;
            });
        };
        syncSubParams();

        // --- AUTH & INITIAL SIGN IN (RULE 3 - Auth Before Queries) ---
        onAuthStateChanged(auth, async (fbUser) => {
            if (fbUser) {
                // Anonymous Firebase session successfully established, now check local session storage
                const savedTeacher = sessionStorage.getItem('current_teacher');
                if (savedTeacher) {
                    state.user = JSON.parse(savedTeacher);
                    // Pastikan kompatibilitas sesi lama untuk field NIP
                    if(!state.user.nip) state.user.nip = "";
                    showTeacherPortal();
                } else {
                    showLoginForm();
                }
            } else {
                // Try logging in anonymously first to satisfy security rules before database check
                try {
                    await signInAnonymously(auth);
                } catch (err) {
                    console.error("Autentikasi Firebase gagal", err);
                }
            }
        });

        // Handle Custom Login (Membaca koleksi 'guru' di Firestore)
        window.loginWithCredentials = async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim().toLowerCase();
            const p = document.getElementById('login-pin').value.trim();
            
            if(!u || !p) {
                window.showToast("Username dan PIN wajib diisi!", "error");
                return;
            }
            
            const btn = document.getElementById('btn-login-submit');
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner-modern mx-auto"></div>`;
            
            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
                
                // Ambil semua dokumen di koleksi 'guru'
                const guruRef = collection(db, 'artifacts', appId, 'public', 'data', 'guru');
                const snap = await getDocs(guruRef);
                
                let matchedGuru = null;
                
                // Cari manual (filter di memori) untuk mencocokkan username & pin
                snap.forEach(doc => {
                    const data = doc.data();
                    if ((data.username || "").toLowerCase() === u && data.pin === p) {
                        matchedGuru = { id: doc.id, ...data };
                    }
                });

        const showTeacherPortal = () => {

            state.settings.kelas = state.user.kelas;
            
            listenClassData();

        // --- NOTIFICATION & MODALS ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');
            
            container.className = `fixed bottom-8 right-8 z-[9999] flex items-center gap-4 px-6 py-4 rounded-2xl shadow-2xl border border-white/10 text-white animate-slide-up ${type === 'error' ? 'bg-rose-600' : 'bg-indigo-900'}`;
            msgEl.textContent = msg;
            icon.setAttribute('data-lucide', type === 'error' ? 'alert-circle' : 'check-circle-2');
            lucide.createIcons();
            
            container.classList.remove('hidden');
            setTimeout(() => container.classList.add('hidden'), 3500);
        };

        window.openConfirm = (title, msg, onYes) => {
            const modal = document.getElementById('confirm-modal');
            const btnYes = document.getElementById('confirm-btn-yes');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = msg;
            
            const newBtn = btnYes.cloneNode(true);
            btnYes.replaceWith(newBtn);
            newBtn.onclick = async () => {
                newBtn.disabled = true;
                await onYes();
                window.closeConfirm();
            };
            modal.classList.remove('hidden');
        };

        window.closeConfirm = () => document.getElementById('confirm-modal').classList.add('hidden');

        // --- MATH CALCULATIONS ---
        const calcValue = (score, subId) => {
            const ideal = parseFloat(state.settings.skor_ideal[subId] || 100);
            const val = (parseFloat(score || 0) / ideal) * 100;
            return isNaN(val) ? 0 : val;
        };

        const formatVal = (score, subId) => {
            const val = calcValue(score, subId);
            return val % 1 === 0 ? val.toFixed(0) : val.toFixed(1);
        };

        // --- SYNC DATA LISTENERS (RULE 1 & 3 COMPLIANT) ---
        window.listenClassData = () => {
            if (!auth.currentUser) return;

            state.unsubs.forEach(u => u());
            state.unsubs = [];

            // Listen Students of Specific Class from Global 'siswa' collection
            const studentUnsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'siswa'), (snap) => {
                state.students = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(s => (s.kelas || "").toLowerCase() === state.user.kelas.toLowerCase());
                
                window.renderActiveView();
                window.renderSiswaList();
            }, (err) => console.error("Student Listen Error:", err));
            state.unsubs.push(studentUnsub);

            // Listen Settings of Class
            const settingsUnsub = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `settings_${state.activeClassId}`, 'config'), (snap) => {
                if (snap.exists()) {
                    state.settings = { ...state.settings, ...snap.data() };
                } else {
                    // Beri nilai otomatis jika ini konfigurasi baru untuk kelas ini
                    state.settings.wali_kelas = state.user.nama;
                    state.settings.nip_wali = state.user.nip;
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', `settings_${state.activeClassId}`, 'config'), state.settings);
                }

                // Paksa pembaruan jika field Wali Kelas masih kosong
                if (!state.settings.wali_kelas) state.settings.wali_kelas = state.user.nama;
                if (!state.settings.nip_wali) state.settings.nip_wali = state.user.nip;

                syncSubParams();
                updateHeaderUI();
                window.renderActiveView();

            state.unsubs.push(settingsUnsub);

            document.getElementById('header-judul').textContent = state.settings.judul;

        };

        window.handleKeyNav = (e, index) => {
            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                const next = document.querySelector(`input[data-index="${index + 1}"]`);
                if (next) next.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prev = document.querySelector(`input[data-index="${index - 1}"]`);
                if (prev) prev.focus();
            }
        };

        window.updateScore = async (sid, val) => {
            if (!auth.currentUser || !state.activeClassId) return;
            const score = val === '' ? 0 : parseFloat(val);
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'siswa', sid), { 
                    [state.activeSubjectId]: score 
                });
                window.showToast("Nilai tersimpan");
            } catch (e) { window.showToast("Gagal menyimpan nilai", "error"); }
        };

        window.bulkImport = async () => {
            if (!auth.currentUser || !state.activeClassId) return;
            const tx = document.getElementById('bulk-names-input');
            const btn = document.getElementById('btn-bulk-import');
            
            const existingNames = new Set(state.students.map(s => (s.nama||"").trim().toLowerCase()));
            const namesInput = tx.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            const uniqueInputNames = Array.from(new Set(namesInput)); 
            const namesToImport = uniqueInputNames.filter(n => !existingNames.has(n.toLowerCase()));

            if (uniqueInputNames.length === 0) return window.showToast("Daftar kosong", "error");
            if (namesToImport.length === 0) return window.showToast("Semua nama sudah terdaftar", "error");

            btn.disabled = true;
            btn.innerHTML = `<div class="flex items-center justify-center gap-3"><div class="spinner-modern"></div><span>Memproses...</span></div>`;

            try {
                const batch = writeBatch(db);
                namesToImport.forEach(name => {
                    const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'siswa'));
                    const data = { nama: name, kelas: state.user.kelas };
                    state.settings.subjects.forEach(s => data[s.id] = 0);
                    batch.set(newRef, data);
                });
                await batch.commit();
                tx.value = '';
                window.showToast(`${namesToImport.length} Siswa Diimpor`);
            } catch (e) { window.showToast("Gagal menyimpan data", "error"); }
            finally {
                btn.disabled = false;
                btn.textContent = "Proses Import";
            }
        };

            if (!auth.currentUser || !state.activeClassId) return;

                window.showToast("Profil diperbarui");

        };

                                        <th class="p-5 min-w-[200px]">Nama Siswa</th>
                                        ${state.settings.subjects.map(s => `<th class="p-5 text-center">${s.label}</th>`).join('')}
                                        <th class="p-5 text-center bg-indigo-50 text-indigo-600 font-bold">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-50">
                                    ${students.map((s, i) => `
                                    <tr class="hover:bg-slate-50/50">
                                        <td class="p-5 text-center text-slate-300">${i+1}</td>
                                        <td class="p-5 uppercase font-extrabold text-slate-800">${s.nama}</td>
                                        ${state.settings.subjects.map(sub => {
                                            const v = calcValue(s[sub.id] || 0, sub.id);
                                            const isLow = v < (state.settings.kktp[sub.id] || 75);
                                            return `<td class="p-5 text-center ${!isLow ? 'text-emerald-600' : 'text-rose-600 font-extrabold italic'}">${v.toFixed(1)}</td>`;
                                        }).join('')}
                                        <td class="p-5 text-center bg-indigo-50/30 font-extrabold text-indigo-900">
                                            ${state.settings.subjects.reduce((a, b) => a + calcValue(s[b.id] || 0, b.id), 0).toFixed(1)}
                                        </td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            } else if (state.currentView === 'stats') {
                if (!state.students.length) { container.innerHTML = `<div class="py-20 text-center bg-white rounded-[2rem] border uppercase font-bold text-slate-300 text-xs tracking-widest">Belum ada siswa terdaftar.</div>`; return; }
                const rankings = [...state.students].map(s => ({ ...s, total: parseFloat(state.settings.subjects.reduce((a, b) => a + calcValue(s[b.id] || 0, b.id), 0).toFixed(1)) })).sort((a,b) => b.total - a.total).slice(0, 10);
                
                container.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-fade-in">
                        <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                            <h4 class="font-extrabold text-slate-800 flex items-center gap-3 mb-8 uppercase tracking-tight"><i data-lucide="award" class="text-amber-500 w-6 h-6"></i> 10 Siswa Terbaik Kelas</h4>
                            <div class="space-y-4">
                                ${rankings.map((s, i) => `
                                <div class="flex items-center gap-6 p-5 bg-slate-50 rounded-2xl border border-white hover:border-indigo-200 transition-all">
                                    <div class="w-10 h-10 flex items-center justify-center rounded-full font-extrabold text-sm ${i===0?'bg-amber-400 text-white':i===1?'bg-slate-300 text-white':i===2?'bg-amber-600 text-white':'bg-white text-slate-400 border'}">
                                        ${i+1}
                                    </div>
                                    <div class="flex-1 font-bold text-slate-800 uppercase text-xs truncate">${s.nama}</div>
                                    <div class="text-xl font-black text-indigo-900">${s.total}</div>
                                </div>`).join('')}
                            </div>
                        </div>
                        <div class="space-y-8">
                            <div class="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                                <h4 class="font-extrabold text-slate-800 uppercase tracking-tight mb-8">Statistik Ketuntasan (KKTP)</h4>
                                <div class="space-y-6">
                                    ${state.settings.subjects.map(sub => {
                                        const countPass = state.students.filter(s => calcValue(s[sub.id], sub.id) >= (state.settings.kktp[sub.id]||75)).length;
                                        const percentPass = state.students.length ? (countPass / state.students.length) * 100 : 0;
                                        return `
                                        <div>
                                            <div class="flex justify-between items-end mb-2">
                                                <span class="text-[10px] font-extrabold uppercase text-slate-500">${sub.label}</span>
                                                <span class="text-[10px] font-bold ${percentPass < 50 ? 'text-rose-500' : 'text-emerald-600'}">${countPass} / ${state.students.length} Siswa</span>
                                            </div>
                                            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                <div class="h-full ${percentPass < 50 ? 'bg-rose-400' : 'bg-emerald-500'} transition-all duration-1000" style="width: ${percentPass}%"></div>
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
            } else if (state.currentView === 'public') {
                container.innerHTML = `
                    <div class="space-y-6 flex flex-col h-full animate-fade-in">
                        <div class="flex justify-between items-center no-print">
                            <div class="flex items-center gap-2">
                                <i data-lucide="info" class="text-indigo-600 w-4 h-4"></i>
                                <span class="text-[10px] font-bold text-slate-400 uppercase">A4 Landscape - Otomatis ke halaman baru jika data penuh</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-2xl font-extrabold text-[11px] flex items-center gap-3 shadow-2xl active:scale-95 tracking-widest uppercase transition-all">
                                    <i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Unduh CSV
                                </button>
                                <button onclick="generatePDF()" id="pdf-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-4 rounded-2xl font-extrabold text-[11px] flex items-center gap-3 shadow-2xl active:scale-95 tracking-widest uppercase transition-all">
                                    <i data-lucide="download" class="w-5 h-5"></i> Simpan PDF Laporan
                                </button>
                            </div>
                        </div>
                        <div id="pdf-preview-container">
                            <div id="pdf-preview-wrapper">
                                <div id="konten-laporan" class="bg-white text-black pdf-times-roman mx-auto flex flex-col" style="width: 297mm; min-height: 210mm; padding: 10mm 15mm; box-sizing: border-box;">
                                    <div class="text-center border-b-[2.5pt] border-black pb-1 mb-4 shrink-0">
                                        <h1 class="text-[13pt] font-bold uppercase leading-tight">PEMERINTAH KABUPATEN PANDEGLANG</h1>
                                        <h2 class="text-[11pt] font-bold uppercase leading-tight">DINAS PENDIDIKAN KEPEMUDAAN DAN OLAHRAGA</h2>
                                        <h3 class="text-[14pt] font-bold uppercase leading-tight mt-0.5">${state.settings.instansi}</h3>
                                        <p class="text-[8pt] italic">${state.settings.alamat}</p>
                                    </div>
                                    <div class="text-center mb-4 shrink-0">
                                        <h4 class="text-[11pt] font-bold uppercase inline-block border-b-[1.5pt] border-black">${state.settings.judul}</h4>
                                        <p class="font-bold text-[9pt] uppercase mt-0.5">${state.settings.tipe_asesmen}</p>
                                    </div>
                                    <div class="mb-2 px-1 font-bold uppercase text-[8pt] flex justify-between shrink-0">
                                        <span>Sekolah: ${state.settings.instansi}</span>
                                        <span>Kelas: ${state.settings.kelas}</span>
                                        <span>TP: ${state.settings.tahun_ajaran}</span>
                                        <span>Semester: ${state.settings.semester}</span>
                                    </div>
                                    <div class="border-[1.5pt] border-black mb-6 flex-1">
                                        <table class="w-full text-[8pt] border-collapse">
                                            <thead>
                                                <tr class="bg-slate-50 border-b-[1.5pt] border-black">
                                                    <th class="p-1 border-r border-black w-8 text-center">NO</th>
                                                    <th class="p-1 border-r border-black text-left pl-2">NAMA PESERTA DIDIK</th>
                                                    ${state.settings.subjects.map(sub => `<th class="p-1 border-r border-black uppercase text-center w-14 text-[7pt]">${sub.label}</th>`).join('')}
                                                    <th class="p-1 w-16 text-center bg-slate-100 font-bold">TOTAL</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${state.students.sort((a,b)=>a.nama.localeCompare(b.nama)).map((s, idx) => `
                                                <tr class="border-b border-black last:border-0">
                                                    <td class="p-0.5 border-r border-black text-center">${idx + 1}</td>
                                                    <td class="p-0.5 border-r border-black uppercase pl-2 whitespace-nowrap overflow-hidden text-ellipsis">${s.nama}</td>
                                                    ${state.settings.subjects.map(sub => {
                                                        const v = calcValue(s[sub.id] || 0, sub.id);
                                                        const isLow = v < (state.settings.kktp[sub.id] || 75);
                                                        return `<td class="p-0.5 border-r border-black text-center ${!isLow ? '' : 'text-red-600 font-bold italic'}">${formatVal(s[sub.id], sub.id)}</td>`;
                                                    }).join('')}
                                                    <td class="p-0.5 text-center font-bold bg-slate-50">${state.settings.subjects.reduce((a, b) => a + calcValue(s[b.id] || 0, b.id), 0).toFixed(1)}</td>
                                                </tr>`).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="flex justify-between px-16 text-[9pt] mt-8 shrink-0" style="page-break-inside: avoid;">
                                        <div class="text-center">
                                            <p class="mb-14">Mengetahui,<br>Kepala Sekolah</p>
                                            <p class="font-bold underline">${state.settings.kepsek || ".............................."}</p>
                                            <p>NIP. ${state.settings.nip_kepsek || "...................................."}</p>
                                        </div>
                                        <div class="text-center">
                                            <p class="mb-14">Pandeglang, ..................... 20...<br>Wali Kelas ${state.settings.kelas}</p>
                                            <p class="font-bold underline">${state.settings.wali_kelas || ".............................."}</p>
                                            <p>NIP. ${state.settings.nip_wali || "...................................."}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                setTimeout(window.updatePreviewScale, 100);
            }
            lucide.createIcons();
        };

        // --- EXPORT PDF CONTROL ---
        window.generatePDF = () => {
            const btn = document.getElementById('pdf-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<div class="flex items-center justify-center gap-3"><div class="spinner-modern"></div><span>Memproses Dokumen...</span></div>`;
            const element = document.getElementById('konten-laporan');
            
            html2pdf().set({
                margin: [0, 0, 0, 0], 
                filename: `Laporan_Asesmen_${state.settings.kelas.replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            }).from(element).save().then(() => {
                btn.innerHTML = originalHtml;
                window.showToast("Laporan PDF berhasil diunduh");
            });
        };

        // --- EXPORT CSV CONTROL ---
        window.exportCSV = () => {
            if (!state.students || state.students.length === 0) {
                window.showToast("Belum ada data siswa", "error");
                return;
            }

            let csvContent = "No,Nama Peserta Didik,";
            
            // Header Mapel
            state.settings.subjects.forEach(sub => {
                csvContent += `"${sub.label}",`;
            });
            csvContent += "Total\n";

            // Baris Nilai Siswa
            const sortedStudents = [...state.students].sort((a,b)=>a.nama.localeCompare(b.nama));
            sortedStudents.forEach((s, idx) => {
                let row = `${idx + 1},"${s.nama}",`;
                let total = 0;
                
                state.settings.subjects.forEach(sub => {
                    const val = calcValue(s[sub.id] || 0, sub.id);
                    total += val;
                    row += `${val.toFixed(1)},`; 
                });
                
                row += `${total.toFixed(1)}\n`;
                csvContent += row;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Data_Nilai_${state.settings.kelas.replace(/\s+/g, '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            window.showToast("Data CSV berhasil diunduh");
        };

        // --- VIEW CONTROL & SIDEBAR ---
        window.switchView = (view) => {
            state.currentView = view;
            const searchContainer = document.getElementById('search-container');
            if (searchContainer) {
                const viewsWithSearch = ['input', 'table', 'public'];
                searchContainer.style.display = viewsWithSearch.includes(view) ? 'block' : 'none';
            }
            document.querySelectorAll('.nav-item').forEach(el => {
                el.className = "nav-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-200 font-extrabold text-[11px] uppercase tracking-widest text-slate-400 hover:bg-white/5 group";
            });
            const activeEl = document.getElementById(`nav-${view}`);
            if (activeEl) {
                activeEl.className = "nav-item w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all duration-200 font-extrabold text-[11px] uppercase tracking-widest bg-indigo-600 text-white shadow-lg relative group";
            }
            window.renderActiveView();
        };

        window.toggleSidebar = () => {
            state.isCollapsed = !state.isCollapsed;
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-72'); sidebar.classList.toggle('w-20');
            document.getElementById('sidebar-logo').classList.toggle('hidden');
            document.querySelectorAll('.nav-text').forEach(e => e.classList.toggle('hidden'));
            document.querySelectorAll('.sidebar-icon').forEach(icon => {
                if (state.isCollapsed) {
                    icon.classList.replace('w-5', 'w-6'); icon.classList.replace('h-5', 'h-6');
                    icon.closest('.nav-item').classList.replace('px-5', 'px-0');
                    icon.closest('.nav-item').classList.add('justify-center');
                } else {
                    icon.classList.replace('w-6', 'w-5'); icon.classList.replace('h-6', 'h-5');
                    icon.closest('.nav-item').classList.replace('px-0', 'px-5');
                    icon.closest('.nav-item').classList.remove('justify-center');
                }
            });
        };

        window.openModal = (type) => {
            if (type === 'settings') {
                const fields = [
                    {k:'judul',l:'Judul Laporan'}, {k:'tipe_asesmen',l:'Tipe Penilaian'},
                    {k:'instansi',l:'Instansi'}, {k:'alamat',l:'Alamat Kop'},
                    {k:'kelas',l:'Nama Kelas'}, {k:'tahun_ajaran',l:'Tahun Pelajaran'},
                    {k:'semester',l:'Semester'}, {k:'kepsek',l:'Kepala Sekolah'},
                    {k:'nip_kepsek',l:'NIP Kepsek'}, {k:'wali_kelas',l:'Wali Kelas'},
                    {k:'nip_wali',l:'NIP Wali'}
                ];
                document.getElementById('settings-fields').innerHTML = fields.map(f => {
                    if (f.k === 'semester') {
                        return `
                        <div>
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">${f.l}</label>
                            <select onchange="updateSettingsField('${f.k}', this.value)" class="w-full px-5 py-3 bg-slate-50 border border-transparent rounded-xl focus:bg-white focus:border-indigo-600 outline-none transition-all font-bold text-sm appearance-none">
                                <option value="1 (GANJIL)" ${state.settings.semester === '1 (GANJIL)' ? 'selected' : ''}>1 (GANJIL)</option>
                                <option value="2 (GENAP)" ${state.settings.semester === '2 (GENAP)' ? 'selected' : ''}>2 (GENAP)</option>
                            </select>
                        </div>`;
                    }
                    if (f.k === 'tipe_asesmen') {
                        const standardTypes = ["Asesmen Sumatif Tengah Semester", "Asesmen Sumatif Akhir Semester"];
                        const isCustom = !standardTypes.includes(state.settings[f.k]);
                        return `
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">${f.l}</label>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <select onchange="handleTipeChange(this.value)" class="flex-1 px-5 py-3 bg-slate-50 border border-transparent rounded-xl focus:bg-white focus:border-indigo-600 outline-none transition-all font-bold text-sm appearance-none">
                                    <option value="Asesmen Sumatif Tengah Semester" ${state.settings[f.k] === 'Asesmen Sumatif Tengah Semester' ? 'selected' : ''}>Sumatif Tengah Semester</option>
                                    <option value="Asesmen Sumatif Akhir Semester" ${state.settings[f.k] === 'Asesmen Sumatif Akhir Semester' ? 'selected' : ''}>Sumatif Akhir Semester</option>
                                    <option value="custom" ${isCustom ? 'selected' : ''}>Lainnya (Input Manual)...</option>
                                </select>
                                <input id="input-tipe-manual" type="text" placeholder="Masukkan tipe asesmen..." oninput="updateSettingsField('${f.k}', this.value)" 
                                    class="${!isCustom ? 'hidden' : ''} flex-1 px-5 py-3 bg-slate-50 border border-transparent rounded-xl focus:bg-white focus:border-indigo-600 outline-none transition-all font-bold text-sm" 
                                    value="${isCustom ? state.settings[f.k] : ''}">
                            </div>
                        </div>`;
                    }
                    return `
                    <div>
                        <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">${f.l}</label>
                        <input type="text" onchange="updateSettingsField('${f.k}', this.value)" class="w-full px-5 py-3 bg-slate-50 border border-transparent rounded-xl focus:bg-white focus:border-indigo-600 outline-none transition-all font-bold text-sm" value="${state.settings[f.k] || ''}">
                    </div>`;
                }).join('');
                window.renderSubjectSettings();
            } else window.renderSiswaList();
            document.getElementById(`modal-${type}`).classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeModal = (type) => document.getElementById(`modal-${type}`).classList.add('hidden');
        window.setActiveSub = (id) => { state.activeSubjectId = id; window.renderActiveView(); };

        // --- RUNNING APPLICATION ON STARTUP ---
        window.onload = async () => {
            document.getElementById('search-input').oninput = (e) => { 
                state.search = e.target.value; 
                window.renderActiveView(); 
            };

            window.addEventListener('resize', window.updatePreviewScale);
            lucide.createIcons();
            
            if (state.user) {
                window.switchView(state.currentView);
            }
        };
    </script>
</body>
</html>
